<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最近帖子控制台</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');
    :root { color-scheme: dark; --ink:#f4f1e9; --muted:#9aa3a0; --line:#293331; --bg:#101716; --panel:#17201e; --accent:#c4ef67; --accent-ink:#17200d; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 80% 10%, #23342c 0, transparent 34%), var(--bg); color:var(--ink); font-family:Manrope, sans-serif; }
    .shell { max-width:1120px; margin:0 auto; padding:42px 28px 70px; } .eyebrow { color:var(--accent); letter-spacing:.16em; font:500 12px 'DM Mono',monospace; text-transform:uppercase; }
    h1 { max-width:680px; margin:16px 0 10px; font-size:clamp(34px,5vw,64px); line-height:1.02; letter-spacing:-.03em; } .lede { max-width:620px; color:var(--muted); margin:0 0 30px; }
    .toolbar { display:flex; gap:12px; align-items:end; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:22px; } label { display:grid; gap:8px; color:var(--muted); font-size:12px; } select,button { min-height:44px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); padding:0 14px; font:600 14px Manrope; } select { min-width:210px; } button { cursor:pointer; } button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); } button:disabled { cursor:wait; opacity:.5; }
    .status { margin-left:auto; color:var(--muted); font:12px 'DM Mono',monospace; } .status strong { color:var(--ink); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:26px; } .post { min-height:188px; border:1px solid var(--line); background:rgba(23,32,30,.8); padding:18px; display:flex; flex-direction:column; justify-content:space-between; transition:transform .18s,border-color .18s; } .post:hover { transform:translateY(-3px); border-color:#718b61; } .post h2 { margin:0 0 22px; font-size:17px; line-height:1.45; } .post-url { color:var(--muted); font:11px 'DM Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .empty { color:var(--muted); border:1px dashed var(--line); padding:28px; margin-top:26px; }
    @media (max-width:650px) { .shell { padding:28px 18px 50px; } h1 { font-size:38px; } .status { width:100%; margin-left:0; } select,button { width:100%; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">XIAOLVSHU / HOME FEED</div>
    <h1>最近帖子，按时间顺序整理。</h1>
    <p class="lede">选择一个已隔离的账号，读取它看到的首页内容。点击帖子后，会在这个账号自己的 Chrome 窗口中打开。</p>
    <section class="toolbar">
      <label>使用账号<select id="account"></select></label>
      <button class="primary" id="refresh">读取最新帖子</button>
      <div class="status" id="status">正在读取账号池…</div>
    </section>
    <section class="grid" id="posts"></section>
  </main>
  <script>
    const account = document.querySelector('#account'), refresh = document.querySelector('#refresh'), posts = document.querySelector('#posts'), status = document.querySelector('#status')
    const setStatus = (text) => { status.textContent = text }
    async function loadAccounts() { const data = await (await fetch('/api/accounts')).json(); account.innerHTML = data.accounts.map((item) => `<option value="${item.phone}">${item.label}</option>`).join(''); setStatus(`${data.accounts.length} 个号码在池中`) }
    async function loadPosts() { refresh.disabled = true; setStatus('正在读取首页…'); posts.innerHTML = ''; try { const data = await (await fetch(`/api/posts?phone=${account.value}`)).json(); if (data.error) throw new Error(data.error); if (!data.posts.length) { posts.innerHTML = '<div class="empty">没有读取到帖子。请确认该账号已登录，并检查页面是否已经加载完成。</div>'; } else { posts.innerHTML = data.posts.map((post) => `<article class="post"><div><h2>${post.title.replaceAll('<','&lt;')}</h2><div class="post-url">${post.url}</div></div><button data-url="${post.url}">打开帖子</button></article>`).join(''); } setStatus(`${data.posts.length} 条首页帖子`); } catch (error) { setStatus(`读取失败：${error.message}`); } finally { refresh.disabled = false } }
    posts.addEventListener('click', async (event) => { const button = event.target.closest('button[data-url]'); if (!button) return; button.disabled = true; try { const response = await fetch('/api/open', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ phone:account.value, url:button.dataset.url }) }); const data = await response.json(); if (data.error) throw new Error(data.error); button.textContent = '已打开'; } catch (error) { button.disabled = false; setStatus(`打开失败：${error.message}`); } })
    refresh.addEventListener('click', loadPosts); loadAccounts().then(loadPosts).catch((error) => setStatus(`初始化失败：${error.message}`))
  </script>
</body>
</html>
